<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Física — Roadmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js"
      }
    }
  </script>
</head>

<body>
  <div class="container">

    <header>
      <!-- Descrição Inicial/Título ========================-->
      <div class="header-label">// roadmap de estudos</div>
      <h1>Zerando a Física<span>.</span></h1>
      <p class="header-sub">Acompanhe o progresso nas questões capítulo por capítulo. Clique nas questões para marcar como feitas.</p>
      <!--==================================================-->

      <!-- Dados de Conclusão ==============================-->
      <div class="global-stats">

        <div class="stat-card">
          <div class="stat-value" id="globalDone">0</div>
          <div class="stat-label">questões feitas</div>
        </div>

        <div class="stat-card">
          <div class="stat-value" id="globalTotal">0</div>
          <div class="stat-label">questões totais</div>
        </div>

        <div class="global-bar-wrap">
          <div class="bar-label">
            <span>Progresso Geral</span>
            <span id="globalBarPct">0%</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="globalBar" style="width:0%"></div>
          </div>
        </div>

      </div>
      <!--==================================================-->
    </header>

    <!-- Botões de Ação ============================================================================-->
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all"    > Todos         </button>
      <button class="filter-btn"        data-filter="peding" > Pendentes     </button>
      <button class="filter-btn"        data-filter="done"   > Concluídos    </button>
      <button class="reset-btn"         onclick="resetAll()"                 > Resetar tudo  </button>
    </div>
    <!--============================================================================================-->

    <div class="volumes" id="volumes"></div>

  </div>

  <!-- <div id="qModal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <h2 id="modalQTitle" class="modal-title">Questão</h2>
      <div id="modalQText" class="modal-text">
          </div>
      <img id="modalQImg" class="modal-img" src="" alt="Resolução da questão" style="display: none;" />
      
      <button id="modalToggleBtn" class="modal-btn" onclick="toggleCurrentQ()">Marcar como Feita</button>
    </div>
  </div> -->

  <div id="addQuestionModal" class="modal-overlay">
    <div class="modal-content">

      <span class="close-modal" id="closeModalBtn">&times;</span>
      <h2 class="modal-title">Adicionar questão</h2>

      <div class="modal-field">
        <label class="modal-label">
          Número da questão <span class="modal-required">*</span>
        </label>
        <input type="number" id="inputNumero" placeholder="ex: 42" />
      </div>

      <div class="modal-field">
        <label class="modal-label">
          Enunciado <span class="modal-optional">— opcional</span>
        </label>
        <textarea id="inputEnunciado" rows="3" placeholder="Digite o enunciado..."></textarea>
      </div>

      <div class="modal-field">
        <label class="modal-label">
          URL da imagem <span class="modal-optional">— opcional</span>
        </label>
        <input type="text" id="inputUrl" placeholder="https://drive.google.com/file/d/..." />
        <div id="imgPreviewWrap" style="display:none">
          <img id="imgPreview" alt="Preview da resolução" />
          <p id="imgError" style="display:none">
            Não foi possível carregar a imagem. Verifique o link.
          </p>
        </div>
      </div>

      <div class="modal-actions">
        <button class="modal-btn-cancel" id="cancelModalBtn">Cancelar</button>
        <button class="modal-btn" id="saveQuestionBtn">Salvar questão</button>
      </div>

    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
